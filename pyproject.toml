[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "youtube-connector-mcp"
version = "0.3.1"
description = "MCP server for YouTube — search videos, get transcripts, channels, and playlists. Works with Claude, Cursor & any MCP client."
authors = ["ShellyDeng08 <ShellyDeng08@users.noreply.github.com>"]
readme = "README.md"
license = "MIT"
packages = [{include = "src"}]
keywords = [
    "mcp",
    "mcp-server",
    "youtube",
    "youtube-api",
    "claude",
    "ai-tools",
    "model-context-protocol",
    "llm",
    "cursor",
    "windsurf",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Multimedia :: Video",
]

[tool.poetry.urls]
Homepage = "https://github.com/ShellyDeng08/youtube-connector-mcp"
Repository = "https://github.com/ShellyDeng08/youtube-connector-mcp"
Documentation = "https://github.com/ShellyDeng08/youtube-connector-mcp/blob/main/README.md"
Website = "https://youtube-connector-mcp-website.vercel.app/"

[tool.poetry.scripts]
youtube-connector-mcp = "src.main:cli_main"

[tool.poetry.dependencies]
python = ">=3.10"
mcp = ">=1.0.0"
google-api-python-client = ">=2.140.0"
pydantic = ">=2.0.0"
youtube-transcript-api = ">=0.6.0"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
responses = ">=0.25.0"
pytest-cov = ">=6.0.0"
pytest-asyncio = ">=1.0.0"
